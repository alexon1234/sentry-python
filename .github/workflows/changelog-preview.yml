name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@8c1d36f152366f100b3178cffefd777ce59b3c0e # v2
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
